name: project_gurukul_ai
description: A production-ready AI-powered learning platform for CBSE/NCERT students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.3
  cloud_firestore: ^5.2.1
  cloud_functions: ^5.1.1
  firebase_storage: ^12.1.2
  firebase_messaging: ^15.0.3
  
  # AI
  google_generative_ai: ^0.4.4
  google_mlkit_text_recognition: ^0.13.0
  google_mlkit_translation: ^0.11.0
  google_mlkit_barcode_scanning: ^0.12.0
  
  # State Management & DI
  flutter_bloc: ^8.1.6
  get_it: ^7.7.0
  
  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  
  # Utilities
  logger: ^2.4.0
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2
  archive: ^3.6.1
  path: ^1.9.0
  crypto: ^3.0.3
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^7.1.0
  
  # UI & Media
  lottie: ^3.1.2
  rive: ^0.13.11
  fl_chart: ^0.68.0
  markdown: ^7.2.2
  url_launcher: ^6.3.0
  font_awesome_flutter: ^10.7.0
  video_player: ^2.9.1
  chewie: ^1.8.5
  flutter_pdfview: ^1.3.2
  webview_flutter: ^4.8.0
  qr_flutter: ^4.1.0
  syncfusion_flutter_pdf: ^26.2.11
  file_picker: ^8.1.2
  http: ^1.2.2
  sqflite: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

