<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurukul AI - Knowledge Base Viewer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; display: flex; height: 100vh; }
        #sidebar { width: 300px; background: #2c3e50; color: white; overflow-y: auto; padding: 20px; border-right: 1px solid #ddd; }
        #content { flex-grow: 1; padding: 40px; overflow-y: auto; }
        h1, h2 { color: #2c3e50; }
        .nav-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #34495e; transition: 0.3s; }
        .nav-item:hover { background: #34495e; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .tag { display: inline-block; background: #e67e22; color: white; padding: 5px 12px; border-radius: 20px; font-size: 0.8em; margin-bottom: 10px; }
        .enrichment { background: #f1f8e9; border-left: 5px solid #4caf50; padding: 15px; margin-top: 15px; }
        .question { background: #fff3e0; border-left: 5px solid #ff9800; padding: 15px; margin-top: 15px; }
        pre { background: #eee; padding: 10px; border-radius: 5px; overflow-x: auto; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>Gurukul AI</h2>
    <div id="file-list">Loading Index...</div>
</div>

<div id="content">
    <h1>Welcome to the Gurukul Knowledge Base</h1>
    <p>Select a chapter from the sidebar to explore enriched NCERT content.</p>
    <div id="viewer-area"></div>
</div>

<script>
    async function init() {
        try {
            const response = await fetch('MASTER_NCERT_LEARNING_INDEX.json');
            const data = await response.json();
            const list = document.getElementById('file-list');
            list.innerHTML = '';

            // Grouping logic based on index structure
            // Assuming index has list of objects {class, subject, chapter, file_path}
            const groups = {};
            data.forEach(item => {
                const key = `Class ${item.class} - ${item.subject}`;
                if (!groups[key]) groups[key] = [];
                groups[key].push(item);
            });

            for (const [group, items] of Object.entries(groups)) {
                const h3 = document.createElement('h3');
                h3.innerText = group;
                list.appendChild(h3);
                items.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'nav-item';
                    div.innerText = item.chapter || item.file_name;
                    div.onclick = () => loadChapter(item.file_path || `NCERT_DATA_PROCESSED/class_0${item.class}/${item.subject.toLowerCase()}/${item.file_name.replace('.pdf', '.json')}`);
                    list.appendChild(div);
                });
            }
        } catch (e) {
            document.getElementById('file-list').innerText = 'Error loading index. Ensure server is running.';
        }
    }

    async function loadChapter(path) {
        const area = document.getElementById('viewer-area');
        area.innerHTML = 'Loading...';
        try {
            const res = await fetch(path);
            const content = await res.json();

            let html = `<div class="card">
                <span class="tag">NCERT Core</span>
                <h2>${content.chapter || content.title}</h2>
                <p><strong>Topic:</strong> ${content.topic || 'General'}</p>
                <div class="description">${content.content || content.summary || ''}</div>`;

            if (content.key_concepts) {
                html += '<h3>Key Concepts</h3><ul>';
                for (let [k, v] of Object.entries(content.key_concepts)) {
                    html += `<li><strong>${k}:</strong> ${v.definition || v}</li>`;
                }
                html += '</ul>';
            }

            if (content.enrichment || content.external_enrichment) {
                html += `<div class="enrichment">
                    <span class="tag" style="background:#4caf50">Gurukul Plus Enrichment</span>
                    <p>${JSON.stringify(content.enrichment || content.external_enrichment, null, 2)}</p>
                </div>`;
            }

            if (content.questions || content.question_bank) {
                html += `<div class="question">
                    <span class="tag" style="background:#ff9800">Practice Questions</span>
                    <pre>${JSON.stringify(content.questions || content.question_bank, null, 2)}</pre>
                </div>`;
            }

            html += '</div>';
            area.innerHTML = html;
        } catch (e) {
            area.innerHTML = `<p style="color:red">Error loading file: ${path}</p>`;
        }
    }

    init();
</script>

</body>
</html>
